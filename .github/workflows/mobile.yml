name: Mobile packages

on:
  workflow_call:
    inputs:
      publish_release:
        description: Publica os pacotes somente quando o CI web termina com sucesso.
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      MOBILE_DISTRIBUTION_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: autocaremanager-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Testar preparação da publicação
        run: python3 -m unittest discover -s mobile -p 'test*.py' -v

      - name: Instalar dependências e sincronizar Capacitor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run android:sync

      - name: Validar token de distribuição Android
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          MOBILE_DISTRIBUTION_TOKEN: ${{ secrets.MOBILE_DISTRIBUTION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MOBILE_DISTRIBUTION_TOKEN" ]]; then
            echo '::error::Configure MOBILE_DISTRIBUTION_TOKEN em SolutionsFurlaneti/CareAuto-FrontEnd > Settings > Secrets and variables > Actions com permissão de escrita nos repositórios AndroidPackageKit e iPhoneOperatingSystem. Consulte mobile/README.md.'
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          repository: SolutionsFurlaneti/AndroidPackageKit
          ref: main
          token: ${{ secrets.MOBILE_DISTRIBUTION_TOKEN }}
          path: distribution

      - name: Validar build Android sem publicação
        if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !inputs.publish_release) }}
        run: node scripts/build-apk.mjs

      - name: Preparar assinatura e versão Android
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configure o secret $name em SolutionsFurlaneti/CareAuto-FrontEnd > Settings > Secrets and variables > Actions para publicar o APK Android assinado. Consulte mobile/README.md."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autocaremanager-release.jks"
          latest_version_code=0
          latest_version_file="distribution/AutoCareManager/latest.json"
          if [[ -f "$latest_version_file" ]]; then
            latest_version_code="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1], encoding="utf-8"))["versionCode"]))' "$latest_version_file")"
          fi
          android_version_code=$((1000 + GITHUB_RUN_NUMBER))
          if (( android_version_code <= latest_version_code )); then
            android_version_code=$((latest_version_code + 1))
          fi
          if (( android_version_code > 2100000000 )); then
            echo '::error::ANDROID_VERSION_CODE ultrapassou o limite aceito pelo Android.'
            exit 1
          fi
          android_version_name="1.0.$((android_version_code - 1000))"
          echo "ANDROID_VERSION_CODE=$android_version_code" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$android_version_name" >> "$GITHUB_ENV"

      - name: Compilar e verificar APK assinado
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/autocaremanager-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          node scripts/build-apk.mjs --release
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          name: autocaremanager-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar APK em AndroidPackageKit/AutoCareManager
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python3 mobile/publish_package.py --repository distribution --artifact android/app/build/outputs/apk/release/app-release.apk --platform android --version-code "$ANDROID_VERSION_CODE" --version-name "$ANDROID_VERSION_NAME" --commit "$GITHUB_SHA"
          git -C distribution config user.name 'github-actions[bot]'
          git -C distribution config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C distribution add -- AutoCareManager
          if ! git -C distribution diff --cached --quiet; then
            git -C distribution commit -m "AutoCareManager Android ${ANDROID_VERSION_NAME}"
            git -C distribution push origin HEAD:main
          fi

      - name: Remover chave temporária
        if: always()
        run: rm -f -- "$RUNNER_TEMP/autocaremanager-release.jks"

  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Compilar PWA para instalação pelo Safari
        env:
          VITE_BASE_PATH: /autocare/
          VITE_API_BASE_URL: /autocare-api
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icons/apple-touch-icon.png
          cd dist && zip -qr ../AutoCareManager-iOS.zip .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autocaremanager-ios-pwa
          path: AutoCareManager-iOS.zip
          if-no-files-found: error

      - name: Validar token de distribuição iOS
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          MOBILE_DISTRIBUTION_TOKEN: ${{ secrets.MOBILE_DISTRIBUTION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MOBILE_DISTRIBUTION_TOKEN" ]]; then
            echo '::error::Configure MOBILE_DISTRIBUTION_TOKEN em SolutionsFurlaneti/CareAuto-FrontEnd > Settings > Secrets and variables > Actions com permissão de escrita nos repositórios AndroidPackageKit e iPhoneOperatingSystem. Consulte mobile/README.md.'
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          repository: SolutionsFurlaneti/iPhoneOperatingSystem
          ref: main
          token: ${{ secrets.MOBILE_DISTRIBUTION_TOKEN }}
          path: distribution

      - name: Publicar PWA em iPhoneOperatingSystem/AutoCareManager
        if: ${{ inputs.publish_release && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python3 mobile/publish_package.py --repository distribution --artifact AutoCareManager-iOS.zip --platform ios --version-code "$((1000 + GITHUB_RUN_NUMBER))" --version-name "1.0.${GITHUB_RUN_NUMBER}" --commit "$GITHUB_SHA"
          git -C distribution config user.name 'github-actions[bot]'
          git -C distribution config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C distribution add -- AutoCareManager
          if ! git -C distribution diff --cached --quiet; then
            git -C distribution commit -m "AutoCareManager iOS PWA 1.0.${GITHUB_RUN_NUMBER}"
            git -C distribution push origin HEAD:main
          fi










